<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список присутствующих</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <span class="chip">Public list</span>
      <h1>Список присутствующих</h1>
    </header>

    <section class="panel">
      <div class="panel-head">
        <h2>Список</h2>
        <button id="resetButton" class="secondary-btn" type="button">Сбросить</button>
      </div>
      <div id="people-list" class="notes-list"></div>
    </section>

    <section class="panel output-panel">
      <div class="panel-head">
        <h2>Готовый текст</h2>
        <button id="copyButton" class="primary-btn" type="button">Копировать</button>
      </div>

      <div id="total-count" class="meta">Отмечено: 0 из 0</div>
      <textarea id="result" readonly aria-label="Готовый текст"></textarea>
      <div id="copy-status" class="copy-status" aria-live="polite"></div>
    </section>

    <footer class="site-footer">
      <a class="profile-link" href="https://toolgool.duckdns.org" target="_blank" rel="noopener noreferrer" aria-label="Открыть сайт Toolgool2021-coder">
        <img class="profile-avatar" src="https://avatars.githubusercontent.com/u/236378052?v=4" alt="Аватар Toolgool2021-coder" />
        <span class="profile-name">Toolgool</span>
      </a>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
