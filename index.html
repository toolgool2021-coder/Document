<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список присутствующих</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">Локальный список</p>
      <h1>Кто сегодня есть?</h1>
      <p class="subtitle">Отметьте людей галочкой или крестиком — готовый текст появится ниже.</p>
    </header>

    <section class="panel list-panel" aria-labelledby="list-title">
      <div class="panel-heading">
        <div>
          <h2 id="list-title">Список</h2>
          <p id="progress">Отмечено: 0 из 0</p>
        </div>
        <button class="button button-ghost" id="reset-button" type="button">Сбросить</button>
      </div>
      <div class="people-list" id="people-list"></div>
      <p class="empty-state" id="empty-state" hidden>Добавьте имена в файл <code>data.js</code>.</p>
    </section>

    <section class="panel result-panel" aria-labelledby="result-title">
      <div class="panel-heading">
        <div>
          <h2 id="result-title">Готовый текст</h2>
          <p>Можно скопировать и отправить.</p>
        </div>
        <button class="button button-primary" id="copy-button" type="button">Скопировать</button>
      </div>
      <textarea id="result" rows="7" readonly aria-label="Сгенерированный текст"></textarea>
      <span class="copy-status" id="copy-status" role="status" aria-live="polite"></span>
    </section>
  </main>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
